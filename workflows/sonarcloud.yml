name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  sonarqube:
    name: SonarCloud
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run data pipeline
        run: python src/data_processing.py

      - name: Train model
        run: python src/train.py

      - name: Run tests with coverage (coverage.py)
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade coverage
          mkdir -p reports
          coverage run --source=src -m pytest --junitxml=reports/junit.xml
          coverage xml -o coverage.xml

      - name: Print `test_add` result
        run: |
          python - <<'PY'
import xml.etree.ElementTree as ET
import sys
import os
xml_path = 'reports/junit.xml'
if not os.path.exists(xml_path):
    print('No junit report found at', xml_path)
    sys.exit(0)
tree = ET.parse(xml_path)
root = tree.getroot()
found = False
for testcase in root.iter('testcase'):
    name = testcase.get('name')
    if name == 'test_add' or name.endswith('.test_add'):
        found = True
        failure = testcase.find('failure') is not None
        error = testcase.find('error') is not None
        if not failure and not error:
            print('TEST PASSED: add function (test_add)')
        else:
            print('TEST FAILED: add function (test_add)')
        break
if not found:
    print('TEST INFO: test_add not found in junit report')
PY

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: |
            models/iris_model.pkl
            metrics.json
            coverage.xml
